<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>书内工作区 · 设计稿 v2（规格图）</title>
<!--
  织章 · 书内工作区设计稿 v2

  这一版是「规格图」，不是可点的假界面：每一帧都是完整界面，帧里出现的每个按钮在正式
  实现里都存在，稿子上没有只属于稿子的控件（没有预览条，没有假开关）。

  与 v1 的三条差别，也是这次要解决的问题：
  1 右栏不再是一摞框：本次设置收成一行 chip，主操作与消息区分开，输入固定在底部
  2 写作操作台不再是第二层窗口：它是第一层视图「任务」，和写作、资料平级
  3 排版按一套尺度来：字号 11/12/12.5/13/15/19，控件 28px，分组用细线与留白，不用盒子

  取色与圆角沿用 desktop-app/src/App.css 的 token，不新增色板。
-->
<style>
:root {
  --ui-font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --reader-font: ui-serif, "Songti SC", "Noto Serif SC", SimSun, serif;
  --num: "SF Mono", "Cascadia Mono", Consolas, monospace;

  --bg: #E7ECE9;
  --surface: #F4F5F2;
  --surface-raised: #FFFFFF;
  --surface-sunken: #DFE5E1;
  --line: #CCD4CF;
  --line-strong: #AEBAB3;
  --text: #202521;
  --text-2: #303833;
  --text-3: #465049;
  --text-4: #626D65;
  --text-5: #7E8981;
  --text-6: #9AA49D;
  --accent: #A5424E;
  --accent-fg: #8D3541;
  --accent-line: #DDBAC0;
  --accent-bg: #F7E9EB;
  --accent-tint: rgba(165, 66, 78, .09);
  --accent-2-fg: #2B5866;
  --accent-2-line: #B5D0D7;
  --accent-2-bg: #E7F0F2;
  --warn-fg: #855D0F;
  --warn-line: #E6D3A6;
  --warn-bg: #FBF2DD;
  --ok-fg: #3C6749;
  --ok-line: #BFD6C6;
  --ok-bg: #EAF3EC;

  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --shadow-1: 0 1px 2px rgba(43, 57, 49, .09);
  --shadow-2: 0 8px 24px rgba(43, 57, 49, .16);
}
html[data-theme="dark"] {
  --bg: #15120D; --surface: #1D1913; --surface-raised: #252019; --surface-sunken: #110E0A;
  --line: #332C22; --line-strong: #4A4133;
  --text: #F3EBDA; --text-2: #E2D8C4; --text-3: #C8BCA5; --text-4: #A2957D; --text-5: #837860; --text-6: #6A604C;
  --accent: #DD7057; --accent-fg: #EE9B84; --accent-line: #6B3427; --accent-bg: #2C1A14; --accent-tint: rgba(221, 112, 87, .14);
  --accent-2-fg: #8FC0DA; --accent-2-line: #2E4A5B; --accent-2-bg: #16242C;
  --warn-fg: #E3BE72; --warn-line: #4F3D18; --warn-bg: #241C0C;
  --ok-fg: #96C0A1; --ok-line: #2F4A37; --ok-bg: #16221A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #D4DCD7; color: var(--text); font: 13px/1.5 var(--ui-font); padding: 28px 0 60px; }
html[data-theme="dark"] body { background: #0C0A07; }
.num { font-variant-numeric: tabular-nums; }

/* 规格图的说明部分：这一层不是界面，是文档 */
.doc-head { max-width: 1360px; margin: 0 auto 24px; padding: 0 20px; }
.doc-head h1 { font-size: 22px; margin-bottom: 6px; }
.doc-head p { max-width: 62em; color: #3E4842; font-size: 12.5px; line-height: 1.8; }
html[data-theme="dark"] .doc-head p { color: var(--text-3); }
.doc-head .switch { margin-top: 12px; display: flex; gap: 6px; }
.doc-head .switch button { padding: 6px 12px; border: 1px solid #B4BEB8; border-radius: var(--r-sm); background: #F4F5F2; color: #3E4842; font-size: 12px; cursor: pointer; }
.doc-head .switch button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

figure.frame { max-width: 1360px; margin: 0 auto 34px; padding: 0 20px; }
figure.frame > figcaption { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
figure.frame > figcaption b { font-size: 14px; }
figure.frame > figcaption span { color: #4A544D; font-size: 12px; }
html[data-theme="dark"] figure.frame > figcaption span { color: var(--text-4); }

/* 下面就是界面本身：1440x900 的工作区，任何一帧都长这样 */
.app { position: relative; display: flex; flex-direction: column; height: 720px; border: 1px solid #B4BEB8; border-radius: var(--r-md); overflow: hidden; background: var(--bg); box-shadow: var(--shadow-2); }

/* 顶栏 */
.topbar { flex: 0 0 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface-raised); }
.back { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-4); font-size: 15px; }
.book { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.book strong { font-size: 15px; font-weight: 600; white-space: nowrap; }
.book span { color: var(--text-5); font-size: 11.5px; white-space: nowrap; }
.grow { flex: 1; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-sunken); }
.seg button { padding: 5px 13px; border: none; border-radius: 4px; background: transparent; color: var(--text-4); font-size: 12.5px; white-space: nowrap; }
.seg button.on { background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow-1); }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-4); font-size: 14px; }
.ghost { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-3); font-size: 12.5px; }

/* 三栏主体 */
.body { flex: 1; display: flex; min-height: 0; }

/* 左栏：240px，三段（头 / 搜索 / 列表）+ 底部操作 */
.rail { flex: 0 0 244px; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.rail-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 8px; }
.rail-head strong { color: var(--text-3); font-size: 12.5px; }
.rail-head small { color: var(--text-5); font-size: 11px; }
.search { display: flex; align-items: center; gap: 6px; margin: 0 12px 10px; padding: 5px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-5); font-size: 12px; }
.search span { flex: 1; }
.search kbd { font: 11px var(--ui-font); color: var(--text-6); }
.list { flex: 1; min-height: 0; overflow: hidden; }
.row { display: block; width: 100%; padding: 8px 14px; border: none; border-left: 3px solid transparent; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.row .t, .row .m { display: block; }
.row .t { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { margin-top: 2px; color: var(--text-5); font-size: 11px; }
.row.on { border-left-color: var(--accent); background: var(--accent-tint); }
.row.on .t { color: var(--accent-fg); font-weight: 600; }
.rail-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.btn-new { flex: 1; height: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); background: transparent; color: var(--text-3); font-size: 12.5px; }

/* 中栏：稿纸 */
.sheet { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface-raised); }
.sheet-head { padding: 16px 30px 0; }
.sheet-title { display: flex; align-items: center; gap: 10px; }
.sheet-title h2 { font-size: 19px; font-weight: 600; }
.link { padding: 4px 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--text-5); font-size: 11.5px; }
.link.on { background: var(--accent-tint); color: var(--accent-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: var(--r-full); background: transparent; color: var(--text-4); font-size: 11.5px; }
.chip b { color: var(--text-2); font-weight: 600; }
.chip.warn { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn-fg); }
.chip.warn b { color: var(--warn-fg); }
.chip.on { border-color: var(--accent-line); background: var(--accent-tint); color: var(--accent-fg); }
.paper { flex: 1; min-height: 0; overflow: hidden; padding: 6px 30px 20px; position: relative; }
.prose { max-width: 33em; margin: 0 auto; font-family: var(--reader-font); font-size: 15.5px; line-height: 1.85; color: var(--text); }
.prose p { text-indent: 2em; margin-bottom: 12px; }
.prose .mark { background: var(--accent-bg); }
.selbar { position: absolute; left: 30%; top: 8px; display: flex; gap: 2px; padding: 4px; border: 1px solid var(--accent-line); border-radius: var(--r-sm); background: var(--surface-raised); box-shadow: var(--shadow-2); }
.selbar button { padding: 5px 10px; border: none; border-radius: 4px; background: transparent; color: var(--text-3); font-size: 11.5px; }
.selbar button.pick { background: var(--accent-bg); color: var(--accent-fg); }

/* 右栏：智能体。三区，从上到下：一行设置 / 消息 / 底部输入 */
.side { flex: 0 0 336px; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--surface); }
.side-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.side-head .model { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-4); font-size: 11.5px; }
.side-set { flex: 0 0 auto; padding: 12px; border-bottom: 1px solid var(--line); }
.set-line { display: flex; flex-wrap: wrap; gap: 6px; }
.set-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 8px; }
.field { display: grid; gap: 4px; }
.field label { color: var(--text-5); font-size: 11px; }
.field .box { padding: 8px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-3); font-size: 12px; line-height: 1.7; }
.thread { flex: 1; min-height: 0; overflow: hidden; }
.msg { padding: 12px; border-bottom: 1px solid var(--line); }
.msg.me { background: var(--surface-raised); }
.msg small { display: block; margin-bottom: 5px; color: var(--text-5); font-size: 11px; }
.msg p { color: var(--text-2); font-size: 12.5px; line-height: 1.75; }
.trace { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.trace span { padding: 3px 8px; border: 1px solid var(--ok-line); border-radius: var(--r-sm); background: var(--ok-bg); color: var(--ok-fg); font-size: 10.5px; }
.composer { flex: 0 0 auto; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--surface-raised); }
.composer .box { height: 56px; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--text-6); font-size: 12.5px; }
.composer .actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 14px; border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--accent); color: #fff; font-size: 12.5px; }
.primary.wide { flex: 1; }
.secondary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--text-3); font-size: 12.5px; }
.hint { color: var(--text-6); font-size: 11px; }

/* 状态条 */
.statusbar { flex: 0 0 32px; display: flex; align-items: center; gap: 16px; padding: 0 18px; border-top: 1px solid var(--line); background: var(--surface); color: var(--text-5); font-size: 11px; }
.statusbar .num { font-variant-numeric: tabular-nums; }
.statusbar button { padding: 3px 8px; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--text-5); font-size: 11px; }
.mobilebar { display: none; }

/* 任务视图：三块任务卡横排，参数与主按钮对齐同一网格 */
.tasks { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0; }
.task { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-left: 1px solid var(--line); }
.task:first-child { border-left: none; }
.task h3 { font-size: 13px; color: var(--text-2); }
.task > p { color: var(--text-5); font-size: 12px; line-height: 1.7; }
.task .row2 { display: flex; align-items: center; gap: 8px; color: var(--text-4); font-size: 12px; }
.pill { padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--surface-raised); color: var(--text-3); font-size: 12px; }
.pill.on { border-color: var(--accent-line); background: var(--accent-tint); color: var(--accent-fg); }
.track { height: 4px; border-radius: var(--r-full); background: var(--surface-sunken); overflow: hidden; }
.track b { display: block; height: 100%; background: var(--accent); }
.task .foot { margin-top: auto; display: flex; gap: 8px; }
.produced { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 6px; }
.produced div { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-4); font-size: 12px; }

/* 窄屏 */
.phone { width: 390px; height: 720px; }
.phone .rail, .phone .side { position: absolute; top: 54px; bottom: 84px; z-index: 20; width: 300px; box-shadow: var(--shadow-2); }
.phone .rail { left: 0; }
.phone .side { right: 0; }
.phone .mobilebar { display: flex; align-items: center; justify-content: space-around; flex: 0 0 52px; border-top: 1px solid var(--line); background: var(--surface-raised); }
.phone .mobilebar button { display: grid; justify-items: center; gap: 3px; padding: 6px 14px; border: none; background: transparent; color: var(--text-4); font-size: 10.5px; }
.phone .mobilebar button.on { color: var(--accent-fg); }
.phone .sheet-head { padding: 14px 16px 0; }
.phone .paper { padding: 4px 16px 12px; }
.phone .book span, .phone .ghost, .phone .statusbar .hide-narrow { display: none; }

/* 两张表 */
table.spec { width: 100%; border-collapse: collapse; margin-top: 8px; background: var(--surface-raised); }
table.spec th, table.spec td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; text-align: left; vertical-align: top; color: var(--text-2); }
table.spec th { color: var(--text-5); font-size: 11px; font-weight: 400; background: var(--surface); }
table.spec code { font: 11.5px var(--num); color: var(--accent-2-fg); }
</style>
</head>
<body>

<div class="doc-head">
  <h1>书内工作区 · 设计稿 v2</h1>
  <p>
    六个状态，每帧都是完整界面。稿子里出现的按钮，正式实现里都能按到；稿子里没有的东西，实现里也不会有。
    与上一版的三条差别：右栏不再是一摞框（设置收成一行 chip），写作操作台不再是浮在正文上的第二层窗口（它是第一层视图「任务」），排版按一套尺度来。
  </p>
  <p style="margin-top:8px">下面每一帧都是 1440×900 工作区的等比缩略，最后一帧是 390 窄屏。</p>
  <div class="switch">
    <button id="t-light" class="on" onclick="setTheme('light')">书页</button>
    <button id="t-dark" onclick="setTheme('dark')">墨夜</button>
  </div>
</div>

<!-- ① 写作视图 -->
<figure class="frame">
  <figcaption><b>① 写作视图（默认）</b><span>顶栏三段：写作 / 资料 / 任务。右栏三区：一行设置、消息、底部输入与主操作。</span></figcaption>
  <div class="app">
    <header class="topbar">
      <button class="back">←</button>
      <div class="book"><strong>穿成恶人前夫后，我只想安静等死</strong><span class="num">第 1 章 / 共 207 章 · 全书 444,365 字</span></div>
      <div class="grow"></div>
      <div class="seg"><button class="on">写作</button><button>资料</button><button>任务</button></div>
      <button class="icon-btn" title="搜索当前章节（Ctrl / ⌘ + F）">⌕</button>
      <button class="ghost">✦ 项目 Agent</button>
      <button class="ghost">⋯ 更多</button>
    </header>

    <div class="body">
      <aside class="rail">
        <div class="rail-head"><strong>章节目录</strong><small class="num">207 章 · 444,365 字</small></div>
        <div class="search">⌕ <span>找章节（标题或序号）</span></div>
        <div class="list">
          <button class="row on"><span class="t">第 1 章 离婚协议</span><span class="m num">3,906 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 2 章 一只行李箱</span><span class="m num">2,663 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 3 章 梧桐路 58 号</span><span class="m num">2,844 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 4 章 抽芽的多肉</span><span class="m num">1,894 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 5 章 划掉的条款</span><span class="m num">1,738 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 6 章 雨中的背影</span><span class="m num">1,595 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 7 章 半糖奶茶</span><span class="m num">1,714 字 · 2 版本</span></button>
          <button class="row"><span class="t">第 8 章 深夜的咳嗽</span><span class="m num">1,447 字 · 2 版本</span></button>
        </div>
        <div class="rail-foot"><button class="btn-new">＋ 新建章节</button><button class="icon-btn">⋯</button></div>
      </aside>

      <main class="sheet">
        <div class="sheet-head">
          <div class="sheet-title">
            <h2>第 1 章 离婚协议</h2>
            <div class="grow"></div>
            <button class="link">复制标题</button>
            <button class="link">写作设置</button>
            <button class="link">阅读</button>
            <button class="link num">历史 2</button>
            <button class="link">标记</button>
          </div>
          <div class="chips">
            <button class="chip">本章资料 <b>章纲 · 边界 · 承诺</b></button>
            <button class="chip warn"><b>到期承诺 1</b> 条</button>
            <button class="chip"><b>待答 2</b></button>
            <button class="chip on">写作智能体</button>
          </div>
        </div>
        <div class="paper">
          <div class="prose">
            <p>头痛是从颅骨正中央炸开的。像有人把一根烧红的钢钉进他的太阳穴，又抡着锤子往下砸。</p>
            <p>沈宴睁开眼的时候，天花板上还有重影，耳膜里嗡嗡作响。有个女声在很远的地方说话，尖锐，冰冷，一个字一个字地砸过来。</p>
            <p>“我警告过你多少次？沈宴，你的字签在这里，白纸黑字。”</p>
            <p>他躺着没动。身下的皮面沙发又软又深，领口勒得难受，一股混着冷汗的酒气从自己身上泛上来。</p>
            <p>不对。这不是他的沙发。他最后的记忆是书桌，是台灯暖黄的光圈，是摊在桌面上批注到一半的校样。</p>
            <p>然后就是现在。</p>
          </div>
        </div>
      </main>

      <aside class="side">
        <div class="side-head">
          <div class="seg"><button class="on">写作智能体</button><button>本章资料</button></div>
          <div class="grow"></div>
          <button class="model">gpt-5.6-luna ▾</button>
          <button class="icon-btn" title="收起右栏">→</button>
        </div>
        <!-- 一行设置：默认就这一行，点开才展开细节 -->
        <div class="side-set">
