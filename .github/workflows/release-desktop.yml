name: 织章 Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本，例如 v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Architecture quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - run: npm run check

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, runner: windows-latest, kind: windows }
          # Linux 包固定在 22.04 上构建：glibc 2.35 覆盖 Ubuntu 22.04 / 24.04 与 Debian 12+，
          # 换到更新的镜像构建会把最低 glibc 要求一起抬高
          - { label: linux-x64, runner: ubuntu-22.04, kind: linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libfuse2
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Build ${{ matrix.label }}
        run: npm run tauri:build --prefix desktop-app
      - name: Package Windows assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem desktop-app/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object { Copy-Item $_.FullName release-assets/ -Force }
      - name: Package Linux assets
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop-app/src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: release-assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
      - name: Publish install packages to public distribution repository
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_GITHUB_TOKEN }}
          DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ] || [ -z "$DISTRIBUTION_REPOSITORY" ]; then
            echo "DISTRIBUTION_GITHUB_TOKEN 或 DISTRIBUTION_REPOSITORY 未配置，跳过公开分发仓库发布。"
            exit 0
          fi
          gh release view "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes "织章 $RELEASE_TAG 安装包。本仓库只提供安装包，不包含源代码。"
          gh release upload "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" release-assets/* --clobber
