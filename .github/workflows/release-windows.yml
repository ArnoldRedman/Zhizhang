name: 织章 Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Architecture quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - run: npm run check

  build:
    name: Build Windows x64
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Build Windows
        run: npm run tauri:build --prefix desktop-app
      - name: Package Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem desktop-app/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object { Copy-Item $_.FullName release-assets/ -Force }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: release-assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
      - name: Publish install packages to public distribution repository
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_GITHUB_TOKEN }}
          DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ] || [ -z "$DISTRIBUTION_REPOSITORY" ]; then
            echo "DISTRIBUTION_GITHUB_TOKEN 或 DISTRIBUTION_REPOSITORY 未配置，跳过公开分发仓库发布。"
            exit 0
          fi
          gh release view "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes "织章 $RELEASE_TAG 安装包。本仓库只提供安装包，不包含源代码。"
          gh release upload "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" release-assets/* --clobber
